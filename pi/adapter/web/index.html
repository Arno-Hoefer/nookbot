<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NookBot</title>
<link rel="icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#F6F5F2;--panel:#FFFFFF;--soft:#EDECE8;--line:#DEDCD6;--hover:#E6E4DF;--text:#17161A;--text2:#45444A;--mut:#7A7980;
  --accent:#FF3B4E;--amber:#F5A524;--green:#2FBF71;--blue:#3B8CFF;--violet:#9B6BFF;--radius:14px;
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0E0E10;--panel:#17171A;--soft:#1C1C1F;--line:#2C2C30;--hover:#26262A;--text:#F3F2EF;--text2:#C9C8CD;--mut:#8D8C93}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 12px}
button:hover{background:var(--hover)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.pri:hover{filter:brightness(1.08)}
button.klein{padding:3px 9px;font-size:13px}
button.text{border:none;background:none;padding:4px 6px;color:var(--mut)}
input,textarea,select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
textarea{resize:vertical}
a{color:var(--blue)}
.app{display:grid;grid-template-columns:270px 1fr;height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.marke{display:flex;align-items:center;gap:10px;padding:16px 16px 10px;font-weight:700;font-size:18px}
.marke .pkt{width:12px;height:12px;border-radius:50%;background:var(--accent)}
.liste{overflow:auto;flex:1;padding:4px 8px 12px}
.fuss{padding:10px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mut);display:flex;gap:8px;align-items:center;cursor:pointer}
.fuss .pkt{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
button.mic.an{background:var(--accent);color:#fff}
.akt{display:grid;grid-template-columns:58px 1fr;gap:2px 10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.akt .z{color:var(--mut);font-variant-numeric:tabular-nums}
.akt .d{grid-column:2;color:var(--mut);font-size:12.5px;overflow-wrap:anywhere}
.akt.fehl .w{color:var(--accent)}
.karte.datei{display:flex;gap:10px;align-items:flex-end;border-left-color:var(--green)}
.gruppe{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:14px 8px 4px}
.eintrag{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;cursor:pointer;min-width:0}
.eintrag:hover{background:var(--hover)}.eintrag.aktiv{background:var(--soft)}
.eintrag .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eintrag .s{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eintrag .t{min-width:0;flex:1}
.ava{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.ava.kapsel{border-radius:9px;width:22px;height:32px}.ava.quadrat{border-radius:7px}.ava.wolke{border-radius:45% 55% 50% 50%}
.ava.dreieck{clip-path:polygon(50% 4%,98% 94%,2% 94%);border-radius:0}
.lauf{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none;animation:p 1s infinite alternate}
@keyframes p{to{opacity:.3}}
.badge{background:var(--accent);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;font-weight:700}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
header.kopf{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
header.kopf h1{font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.kopf .sub{font-size:13px;color:var(--mut);font-weight:400}
.menue-knopf{display:none}
#verlauf{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.bl{max-width:780px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.m{max-width:88%;padding:10px 14px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--line);overflow-wrap:anywhere}
.m.user{align-self:flex-end;background:var(--soft);border-color:transparent;white-space:pre-wrap}
.m.bot{align-self:flex-start}
.m.error{border-color:var(--accent);color:var(--accent)}
.m.zus{border-color:var(--violet)}
.m .wer{font-size:12px;color:var(--mut);margin-bottom:2px;font-weight:600}
.werkzeug{align-self:flex-start;font-size:12.5px;color:var(--mut);padding:2px 10px;border-radius:20px;background:var(--soft)}
.karte{align-self:stretch;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:var(--radius);background:var(--panel);padding:12px 14px}
.karte.ged{border-left-color:var(--violet);padding:8px 12px;display:flex;gap:10px;align-items:center;font-size:14px}
.karte.ged.zurueck{opacity:.5;text-decoration:line-through}
.karte.abl,.karte.vor{border-left-color:var(--amber)}
.karte.frei{border-left-color:var(--accent)}
.karte .titel{font-weight:700;margin-bottom:6px}
.karte .knoepfe{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.karte pre.schritte{white-space:pre-wrap;font:13px/1.45 ui-monospace,Menlo,monospace;background:var(--soft);padding:10px;border-radius:10px;max-height:300px;overflow:auto;margin:6px 0 0}
.teil{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.teil:first-of-type{border-top:none}
.teil .st{font-size:12px;border-radius:8px;padding:1px 8px;background:var(--soft);white-space:nowrap}
.st.fertig{color:var(--green)}.st.fehler{color:var(--accent)}.st.laeuft{color:var(--amber)}
.denkt{align-self:flex-start;color:var(--mut);font-size:14px}
.md p{margin:.35em 0}.md h1,.md h2,.md h3,.md h4{margin:.6em 0 .3em;font-size:1.05em}
.md ul,.md ol{margin:.3em 0;padding-left:1.4em}
.md code{font:13px ui-monospace,Menlo,monospace;background:var(--soft);padding:1px 5px;border-radius:5px}
.md pre{background:var(--soft);padding:10px;border-radius:10px;overflow:auto}.md pre code{background:none;padding:0}
.md table{border-collapse:collapse;margin:.5em 0;font-size:14px;display:block;overflow:auto}
.md th,.md td{border:1px solid var(--line);padding:4px 8px;text-align:left}
.md blockquote{margin:.4em 0;padding-left:10px;border-left:3px solid var(--line);color:var(--text2)}
footer.eingabe{padding:12px 20px 16px;border-top:1px solid var(--line);background:var(--panel)}
footer.eingabe .zeile{max-width:780px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
footer.eingabe textarea{min-height:44px;max-height:240px}
.hinweis{max-width:780px;margin:6px auto 0;font-size:12px;color:var(--mut)}
.seite{flex:1;overflow:auto;padding:20px}
.seite .bl{gap:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.box h3{margin:0 0 8px;font-size:15px}
.zeilen{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px}
.ziehen{outline:3px dashed var(--blue);outline-offset:-10px}
#login{max-width:420px;margin:12vh auto;padding:24px}
.chips{display:flex;gap:6px;flex-wrap:wrap;max-width:780px;margin:0 auto 8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:16px;background:var(--soft);font-size:13px;cursor:pointer;border:1px solid transparent;user-select:none}
.chip.an{background:var(--text);color:var(--bg)}
.chip .x{color:var(--mut);cursor:pointer}
.feld{display:flex;flex-direction:column;gap:4px;margin:8px 0}.feld>span{font-size:12px;color:var(--mut)}
.reihe{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.eintrag .zahn{visibility:hidden;color:var(--mut);padding:2px 6px;border-radius:6px}.eintrag:hover .zahn{visibility:visible}.eintrag .zahn:hover{background:var(--line)}
.schalter{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.schalter input{width:auto}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.an{opacity:1}
dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);color:var(--text);max-width:560px;width:calc(100% - 32px)}
dialog::backdrop{background:#0006}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 25% 0 0;z-index:5;transform:translateX(-105%);transition:transform .2s}
  aside.offen{transform:none;box-shadow:0 0 40px #0005}
  .menue-knopf{display:inline-block}
  .lang{display:none}
  header.kopf{gap:6px}
  #verlauf,.seite{padding:14px 16px}
  header.kopf,footer.eingabe{padding-left:16px;padding-right:16px}
  .m{max-width:94%}
}
</style>
</head>
<body>
<div id="login" hidden>
  <div class="box">
    <h3>NookBot</h3>
    <p class="mut">Schlüssel eingeben – derselbe wie in der App (Einstellungen → Schlüssel). Er bleibt nur in diesem Browser gespeichert.</p>
    <form id="loginForm"><input id="tok" type="password" autocomplete="current-password" placeholder="nb_…" required>
    <div class="zeilen" style="margin-top:10px"><button class="pri">Anmelden</button><span id="loginFehler" class="mut"></span></div></form>
  </div>
</div>
<div class="app" id="app" hidden>
  <aside id="seite">
    <div class="marke"><span class="pkt"></span>NookBot <span class="mut" id="ver" style="font-weight:400;font-size:12px"></span></div>
    <div class="liste" id="nav"></div>
    <div class="fuss" id="status" title="Einstellungen"><span class="pkt"></span><span id="statusT">verbinde …</span></div>
  </aside>
  <main id="haupt"></main>
</div>
<dialog id="dlg"></dialog>
<div id="toast"></div>
<script>
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const store = {get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch { /* privat */ } }};
let TOKEN = store.get('nb_token') || '';
const S = {bots: [], sessions: [], routinen: [], ablaeufe: [], gedaechtnis: [], seq: 0, ansicht: {art: 'chat', id: null}, offen: null, freigaben: {}, webFreigaben: false};

function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('an'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('an'), 2600); }

async function api(method, p, body) {
  const r = await fetch(p, {method, headers: {'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json'}, body: body ? JSON.stringify(body) : undefined});
  if (r.status === 401) { abmelden(); throw new Error('Schlüssel abgelehnt'); }
  const o = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(o.error || ('HTTP ' + r.status));
  return o;
}
function abmelden() { store.set('nb_token', null); TOKEN = ''; $('#app').hidden = true; $('#login').hidden = false; }

// ── Markdown (sicher: erst escapen, dann formatieren) ──
function md(src) {
  const blocks = []; let t = esc(src);
  t = t.replace(/```[\w-]*\n([\s\S]*?)```/g, (_, c) => { blocks.push('<pre><code>' + c + '</code></pre>'); return '\u0000' + (blocks.length - 1) + '\u0000'; });
  const inl = (x) => x.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
  const out = []; const lines = t.split('\n'); let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^\u0000\d+\u0000$/.test(l.trim())) { out.push(blocks[+l.trim().slice(1, -1)]); i++; continue; }
    if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
      const row = (x) => x.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
      let h = '<table><tr>' + row(l).map((c) => '<th>' + inl(c) + '</th>').join('') + '</tr>'; i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { h += '<tr>' + row(lines[i]).map((c) => '<td>' + inl(c) + '</td>').join('') + '</tr>'; i++; }
      out.push(h + '</table>'); continue;
    }
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)$/))) { out.push(`<h${m[1].length + 1}>${inl(m[2])}</h${m[1].length + 1}>`); i++; continue; }
    if (/^\s*([-*•]|\d+[.)])\s+/.test(l)) {
      const ol = /^\s*\d/.test(l); let h = ol ? '<ol>' : '<ul>';
      while (i < lines.length && /^\s*([-*•]|\d+[.)])\s+/.test(lines[i])) { h += '<li>' + inl(lines[i].replace(/^\s*([-*•]|\d+[.)])\s+/, '')) + '</li>'; i++; }
      out.push(h + (ol ? '</ol>' : '</ul>')); continue;
    }
    if (/^&gt;\s?/.test(l)) { out.push('<blockquote>' + inl(l.replace(/^&gt;\s?/, '')) + '</blockquote>'); i++; continue; }
    if (!l.trim()) { i++; continue; }
    const para = [l]; i++;
    while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|\s*([-*•]|\d+[.)])\s|\s*\||&gt;|\u0000)/.test(lines[i])) para.push(lines[i++]);
    out.push('<p>' + inl(para.join('<br>')) + '</p>');
  }
  return out.join('');
}

// ── Daten ──
const bot = (id) => S.bots.find((b) => b.id === id);
const botName = (id) => bot(id)?.name || id || '';
function ava(b, gr = 30) {
  const f = b?.form || 'kreis';
  return `<span class="ava ${esc(f)}" style="background:${esc(b?.farbe || '#888')};${f === 'kapsel' ? '' : `width:${gr}px;height:${gr}px`}">${f === 'dreieck' ? '' : esc((b?.name || '?')[0])}</span>`;
}
async function laden() {
  const o = await api('GET', '/api/state');
  Object.assign(S, {bots: o.bots, sessions: o.sessions, routinen: o.routinen, ablaeufe: o.ablaeufe || [], gedaechtnis: o.gedaechtnis || [],
    erinnerungen: o.erinnerungen || [], ausloeser: o.ausloeser || [], seq: o.seq, webFreigaben: !!o.freigaben_web});
  $('#ver').textContent = o.version;
  S.bots.sort((a, b) => (b.kapitaen ? 1 : 0) - (a.kapitaen ? 1 : 0) || a.name.localeCompare(b.name));
}

// ── Ereignisse (SSE über fetch, damit der Schlüssel im Header bleibt) ──
async function ereignisse() {
  for (;;) {
    try {
      const r = await fetch('/api/events?since=' + S.seq, {headers: {'Authorization': 'Bearer ' + TOKEN}});
      if (r.status === 401) return abmelden();
      const rd = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
      for (;;) {
        const {value, done} = await rd.read(); if (done) break;
        buf += dec.decode(value, {stream: true});
        let k; while ((k = buf.indexOf('\n\n')) >= 0) {
          const chunk = buf.slice(0, k); buf = buf.slice(k + 2);
          const d = chunk.split('\n').filter((x) => x.startsWith('data: ')).map((x) => x.slice(6)).join('\n');
          if (d) { try { ereignis(JSON.parse(d)); } catch (e) { console.warn(e); } }
        }
      }
    } catch (e) { console.warn('SSE', e); }
    await new Promise((r) => setTimeout(r, 3000));
  }
}
let navT;
function ereignis(e) {
  if (e.seq) S.seq = Math.max(S.seq, e.seq);
  const neuZeichnen = () => { clearTimeout(navT); navT = setTimeout(nav, 120); };
  if (e.t === 'reset') { S.seq = e.seq; laden().then(() => { nav(); zeigen(); }); return; }
  if (e.t === 'session') { const i = S.sessions.findIndex((x) => x.id === e.s.id); if (i >= 0) S.sessions[i] = e.s; else S.sessions.unshift(e.s); neuZeichnen(); }
  if (e.t === 'session_del') { S.sessions = S.sessions.filter((x) => x.id !== e.s); neuZeichnen(); }
  if (e.t === 'busy') { const x = S.sessions.find((y) => y.id === e.s); if (x) x.laeuft = e.v; neuZeichnen(); if (S.offen?.id === e.s) { S.offen.laeuft = e.v; chatZeichnen(); } }
  if (e.t === 'msg' && S.offen?.id === e.s) {
    const i = S.offen.msgs.findIndex((m) => m.id === e.m.id);
    if (i >= 0) S.offen.msgs[i] = {...S.offen.msgs[i], ...e.m}; else S.offen.msgs.push(e.m);
    chatZeichnen();
  }
  if (e.t === 'del' && S.offen?.id === e.s) { S.offen.msgs = S.offen.msgs.filter((m) => m.id !== e.id); chatZeichnen(); }
  if (e.t === 'arbeit' && S.ansicht.art === 'arbeit') seiteArbeit();
  if (e.t === 'aktivitaet' && S.ansicht.art === 'aktivitaet') { clearTimeout(S.aktT); S.aktT = setTimeout(seiteAktivitaet, 800); }
  if (['bots', 'routinen', 'ablaeufe', 'gedaechtnis', 'erinnerungen', 'ausloeser'].includes(e.t)) laden().then(() => { nav(); if (S.ansicht.art !== 'chat' && !S.bearbeitet) zeigen(); });
  if (e.t === 'busy' && !e.v) fertigMelden(e.s);
}

// ── Navigation ──
function nav() {
  const sess = (id) => S.sessions.find((x) => x.id === id);
  const a = S.ansicht;
  let h = '<div class="gruppe">Bots</div>';
  for (const b of S.bots) {
    const s = sess(b.sitzung) || {};
    h += `<div class="eintrag ${a.art === 'chat' && a.id === b.sitzung ? 'aktiv' : a.art === 'bot' && a.id === b.id ? 'aktiv' : ''}" data-chat="${esc(b.sitzung)}">${ava(b)}
      <div class="t"><div class="n">${esc(b.name)} <span class="mut">${esc(b.rolle || '')}</span></div><div class="s">${esc(s.letzte || '')}</div></div>
      ${s.laeuft ? '<span class="lauf"></span>' : s.ungelesen ? `<span class="badge">${s.ungelesen}</span>` : ''}<span class="zahn" data-bot-edit="${esc(b.id)}" title="Einstellungen von ${esc(b.name)}">⚙</span></div>`;
  }
  h += `<div class="eintrag ${a.art === 'bot' && !a.id ? 'aktiv' : ''}" data-seite="bot"><span class="ava" style="background:var(--line);color:var(--text)">+</span><div class="t"><div class="n">Neuer Bot</div></div></div>`;
  const runden = S.sessions.filter((x) => x.art === 'runde').slice(0, 8);
  h += '<div class="gruppe">Runden</div>';
  h += `<div class="eintrag" data-seite="runde"><span class="ava" style="background:var(--violet)">+</span><div class="t"><div class="n">Neue Runde</div></div></div>`;
  for (const r of runden) h += `<div class="eintrag ${a.id === r.id ? 'aktiv' : ''}" data-chat="${esc(r.id)}"><span class="ava" style="background:var(--violet)">R</span><div class="t"><div class="n">${esc(r.titel)}</div><div class="s">${esc(r.letzte)}</div></div>${r.laeuft ? '<span class="lauf"></span>' : ''}</div>`;
  const entw = S.ablaeufe.filter((x) => x.status === 'entwurf').length;
  h += '<div class="gruppe">Mehr</div>';
  const offenF = Object.values(S.freigaben).filter((f) => f && f.status === 'offen').length;
  for (const [k, n, z] of [['suche', 'Suche', 0], ['freigaben', 'Freigaben', offenF], ['ablaeufe', 'Abläufe', entw], ['routinen', 'Routinen', 0],
    ['ausloeser', 'Auslöser', (S.ausloeser || []).filter((x) => x.fehler).length], ['aktivitaet', 'Aktivität', 0], ['arbeit', 'Arbeitsordner', 0], ['erinnerungen', 'Erinnerungen', 0], ['gedaechtnis', 'Gedächtnis', 0], ['wissen', 'Wissen', 0], ['datenbanken', 'Datenbanken', 0],
    ['archiv', 'Ältere Unterhaltungen', 0], ['zugriffe', 'Zugriffe', 0], ['einstellungen', 'Einstellungen', 0]]) {
    h += `<div class="eintrag ${a.art === k ? 'aktiv' : ''}" data-seite="${k}"><div class="t"><div class="n">${n}</div></div>${z ? `<span class="badge">${z}</span>` : ''}</div>`;
  }
  h += `<div class="eintrag" data-aus="1"><div class="t"><div class="s">Abmelden</div></div></div>`;
  $('#nav').innerHTML = h;
}
$('#nav').addEventListener('click', (ev) => {

// ── Chat ──
async function chatOeffnen(sid) {
  if (!sid) return;
  S.ansicht = {art: 'chat', id: sid};
  const s = await api('GET', '/api/sessions/' + encodeURIComponent(sid));
  S.offen = s;
  const b = bot(s.bot);
  const runde = s.art === 'runde';
  const nurLesen = runde || s.art === 'intern' || s.art === 'archiv';
  S.anhaenge = S.anhaengeSid === sid ? (S.anhaenge || []) : []; S.anhaengeSid = sid;
  $('#haupt').innerHTML = kopf(runde ? esc(s.titel) : `${esc(b?.name || '')}`, runde ? 'Runde' : s.art === 'archiv' ? 'älteres Gespräch' : esc(b?.rolle || ''),
    nurLesen ? '' : `<button class="klein text" id="vorlesen" title="Antworten mit der Stimme des Bots vorlesen">${vorlesenAn() ? '🔊' : '🔈'}</button>
     <button class="klein" id="alsAblauf" title="Den Weg aus diesem Gespräch als wiederverwendbaren Ablauf speichern">📋<span class="lang"> Als Ablauf speichern</span></button>
     <button class="klein text" id="neuBeginnen" title="Neue Unterhaltung, die alte bleibt im Archiv">↺<span class="lang"> Neu beginnen</span></button>
     <button class="klein text" id="botEinst" title="Einstellungen von ${esc(b?.name || '')}">⚙</button>`)
    + '<div id="verlauf"><div class="bl" id="bl"></div></div>'
    + (nurLesen ? '' : `<footer class="eingabe"><div class="chips" id="anh"></div><div class="zeile"><button class="text" id="anhKnopf" title="Datei oder Bild anhängen">📎</button><input type="file" id="anhDatei" multiple hidden>
      <textarea id="txt" rows="1" placeholder="Nachricht an ${esc(b?.name || 'Bot')} …"></textarea><button class="text mic" id="mic" title="Diktieren (Spracherkennung auf dem Pi)">🎙</button><button class="pri" id="senden">Senden</button></div>
      <div class="hinweis">Enter sendet, Umschalt+Enter für eine neue Zeile. Dateien und Screenshots hierher ziehen oder einfügen (Cmd/Strg+V) → Anhang. Als Wissen: ⚙ → Wissen.</div></footer>`);
  chatZeichnen(true);
  const txt = $('#txt');
  if (txt) {
    const entwurf = store.get('nb_entwurf_' + sid); if (entwurf) txt.value = entwurf;
    const groesse = () => { txt.style.height = 'auto'; txt.style.height = Math.min(240, txt.scrollHeight + 2) + 'px'; };
    txt.addEventListener('input', () => { groesse(); store.set('nb_entwurf_' + sid, txt.value || null); });
    txt.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); senden(); } });
    $('#senden').onclick = senden; groesse(); txt.focus();
    $('#mic').onclick = () => diktieren(txt, groesse);
    anhaengeZeichnen();
    $('#anhKnopf').onclick = () => $('#anhDatei').click();
    $('#anhDatei').onchange = async (e) => { for (const f of e.target.files) await anhaengen(f); e.target.value = ''; };
    txt.addEventListener('paste', async (e) => { const fs = [...(e.clipboardData?.files || [])]; if (fs.length) { e.preventDefault(); for (const f of fs) await anhaengen(f); } });
    $('#vorlesen').onclick = () => { store.set('nb_vorlesen', vorlesenAn() ? null : '1'); $('#vorlesen').textContent = vorlesenAn() ? '🔊' : '🔈'; if (!vorlesenAn()) vorleserStopp(); toast(vorlesenAn() ? 'Antworten werden vorgelesen' : 'Vorlesen aus'); };
    $('#botEinst').onclick = () => { S.ansicht = {art: 'bot', id: s.bot}; nav(); zeigen(); };
    $('#alsAblauf').onclick = async () => {
      const hinweis = prompt('Als Ablauf speichern – optional ein Hinweis (z. B. „immer für die letzten 7 Tage“):', '');
      if (hinweis === null) return;
      try { await api('POST', `/api/sessions/${sid}/ablauf`, {hinweis}); toast('Der Bot schreibt einen Ablauf-Entwurf …'); } catch (e) { toast(e.message); }
    };
    $('#neuBeginnen').onclick = async () => {
      if (!confirm('Neue Unterhaltung beginnen? Die bisherige bleibt im Archiv (App → Menü).')) return;
      const o = await api('POST', `/api/bots/${s.bot}/neu`); await laden(); S.ansicht = {art: 'chat', id: o.sitzung}; nav(); zeigen();
    };
    const vl = $('#verlauf');
    vl.addEventListener('dragover', (e) => { e.preventDefault(); vl.classList.add('ziehen'); });
    vl.addEventListener('dragleave', () => vl.classList.remove('ziehen'));
    vl.addEventListener('drop', async (e) => { e.preventDefault(); vl.classList.remove('ziehen'); for (const f of e.dataTransfer.files) await anhaengen(f); });
  }
  if (s.ungelesen) laden().then(nav);
}
async function senden() {
  const txt = $('#txt'); const t = txt.value.trim(); const mit = S.anhaenge || [];
  if ((!t && !mit.length) || !S.offen) return;
  if (S.anhangLaeuft) return toast('Anhang lädt noch …');
  const voll = (t + (mit.length ? '\n\n' + mit.map((a) => a.zeile).join('\n') : '')).trim();
  txt.value = ''; txt.style.height = 'auto'; store.set('nb_entwurf_' + S.offen.id, null); S.anhaenge = []; anhaengeZeichnen();
  try { await api('POST', `/api/sessions/${S.offen.id}/senden`, {text: voll}); } catch (e) { toast(e.message); txt.value = t; S.anhaenge = mit; anhaengeZeichnen(); }
}
function dateiB64(f) { return new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = no; r.readAsDataURL(f); }); }
async function anhaengen(f) {
  if (!S.offen) return;
  if (f.size > 20e6) return toast(f.name + ': zu groß (max. 20 MB)');
  const name = f.name && f.name !== 'image.png' ? f.name : 'Screenshot ' + new Date().toLocaleTimeString('de-DE').slice(0, 5) + '.png';
  S.anhangLaeuft = true; anhaengeZeichnen();
  try {
    const o = await api('POST', `/api/sessions/${S.offen.id}/anhang`, {name, b64: await dateiB64(f)});
    S.anhaenge = [...(S.anhaenge || []), {name: o.name, zeile: o.zeile, bild: o.art === 'bild'}];
    if (o.hinweis) toast(o.hinweis);
  } catch (e) { toast(name + ': ' + e.message); }
  S.anhangLaeuft = false; anhaengeZeichnen();
}
function anhaengeZeichnen() {
  const el = $('#anh'); if (!el) return;
  el.innerHTML = (S.anhaenge || []).map((a, i) => `<span class="chip">${a.bild ? '🖼' : '📎'} ${esc(a.name)} <span class="x" data-anh-weg="${i}">✕</span></span>`).join('')
    + (S.anhangLaeuft ? '<span class="mut">lädt hoch …</span>' : '');
  el.querySelectorAll('[data-anh-weg]').forEach((x) => x.onclick = () => { S.anhaenge.splice(+x.dataset.anhWeg, 1); anhaengeZeichnen(); });
}
async function wissenHoch(scope, f) {
  if (f.size > 15e6) return toast(f.name + ': zu groß');
  try {
    await api('POST', '/api/wissen/' + scope, {name: f.name, b64: await dateiB64(f)});  // Pi wandelt PDF, Word, Excel … in Text um
    toast(f.name + ' → Wissen' + (scope === 'global' ? ' (alle Bots)' : ' von ' + botName(scope)));
  } catch (e) { toast(f.name + ': ' + e.message); }
}

const FREI = /\bF-[0-9a-f]{6}\b/g;
function chatZeichnen(unten) {
  const s = S.offen; if (!s) return;
  const vl = $('#verlauf'); const amEnde = unten || (vl.scrollHeight - vl.scrollTop - vl.clientHeight < 80);
  let h = ''; let tools = [];
  const toolsRaus = () => { if (tools.length) { h += `<div class="werkzeug">✓ ${esc([...new Set(tools.join(',').split(',').map(werkzeugText))].join(' · '))}</div>`; tools = []; } };
  for (const m of s.msgs) {
    if (m.role === 'thought') continue;
    if (m.role === 'tool') { tools.push(m.text || 'werkzeug'); continue; }
    toolsRaus();
    if (m.role === 'user') h += `<div class="m user">${esc(m.text)}</div>`;
    else if (m.role === 'error') h += `<div class="m error">${esc(m.text)}</div>`;
    else if (m.role === 'info') h += karte(m);
    else if (m.role === 'bot' && m.text?.trim()) {
      const wer = s.art === 'runde' ? `<div class="wer">${esc(botName(m.bot))}${m.zusammenfassung ? ' · Zusammenfassung' : m.gespraech ? ' · Gespräch ' + m.gespraech : ''}</div>` : '';
      h += `<div class="m bot md ${m.zusammenfassung ? 'zus' : ''}">${wer}${md(m.text)}</div>`;
      for (const fid of new Set(m.text.match(FREI) || [])) h += freigabeKarte(fid);
    }
  }
  toolsRaus();
  if (s.laeuft) h += '<div class="denkt">… arbeitet</div>';
  $('#bl').innerHTML = h;
  if (amEnde) vl.scrollTop = vl.scrollHeight;
}
function karte(m) {
  if (m.art === 'datei') {
    const bild = /\.(png|jpe?g|gif|webp)$/i.test(m.ref || '');
    return `<div class="karte datei"><div style="flex:1;min-width:0">${bild ? `<img data-arbeit-bild="${esc(m.ref)}" alt="${esc(m.ref)}" style="max-width:100%;max-height:420px;border-radius:10px;display:block;margin-bottom:6px;cursor:zoom-in">` : ''}
      <span>📎 ${esc(m.ref)}</span> <span class="mut">· Arbeitsordner</span></div><button class="klein" data-arbeit-laden="${esc(m.ref)}">Laden</button></div>`;
  }
  if (m.art === 'gedaechtnis') return `<div class="karte ged ${m.zurueck ? 'zurueck' : ''}"><span style="flex:1">${esc(m.text)}</span>${m.zurueck ? '' : `<button class="klein text" data-vergessen="${esc(m.ref)}">Rückgängig</button>`}</div>`;
  if (m.art === 'ablauf') {
    const st = m.status || 'entwurf';
    const a = S.ablaeufe.find((x) => x.id === m.ref);
    return `<div class="karte abl"><div class="titel">📋 Ablauf: ${esc(m.titel || a?.name || '')} <span class="mut">${st === 'aktiv' ? '· gespeichert ✓' : st === 'verworfen' ? '· verworfen' : '· Entwurf'}</span></div>
      ${a ? `<pre class="schritte">${esc(a.schritte)}</pre>` : ''}
      ${st === 'entwurf' && a ? `<div class="knoepfe"><button class="pri klein" data-abl-ok="${esc(a.id)}">Speichern</button><button class="klein" data-abl-edit="${esc(a.id)}">Ändern</button><button class="klein text" data-abl-weg="${esc(a.id)}">Verwerfen</button></div>` : ''}</div>`;
  }
  if (m.art === 'vorschlag') {
    const st = m.status || 'offen';
    return `<div class="karte vor"><div class="titel">💡 Vorschlag <span class="mut">${st === 'angenommen' ? '· angenommen ✓' : st === 'abgelehnt' ? '· abgelehnt' : st === 'im_chat' ? '· im Chat beantwortet' : ''}</span></div>
      <div>${esc((m.text || '').replace(/^💡 /, ''))}</div>
      ${st === 'offen' ? `<div class="knoepfe"><button class="pri klein" data-vor-ja="${esc(m.ref)}">Ja, mach das</button><button class="klein text" data-vor-nein="${esc(m.ref)}">Nein danke</button></div>` : ''}</div>`;
  }
  if (m.art === 'auftraege') {
    return `<div class="karte"><div class="titel">🧭 Aufträge verteilt</div>${m.ziel ? `<div class="mut">${esc(m.ziel)}</div>` : ''}
      ${(m.teile || []).map((t) => `<div class="teil">${ava(bot(t.bot), 22)}<div style="flex:1;min-width:0"><b>${esc(t.name)}</b> <span class="mut">${esc(t.auftrag.slice(0, 140))}</span></div>
        <span class="st ${esc(t.status)}">${{laeuft: 'läuft …', fertig: 'fertig', fehler: 'Fehler'}[t.status] || esc(t.status)}</span><button class="klein text" data-intern="${esc(t.sitzung)}">ansehen</button></div>`).join('')}</div>`;
  }
  return `<div class="karte">${esc(m.text)}</div>`;
}
function freigabeKarte(fid) {
  const f = S.freigaben[fid];
  if (!S.webFreigaben) return `<div class="karte frei"><b>Freigabe ${fid}</b> <span class="mut">– in der App entscheiden</span></div>`;

  const st = {offen: 'wartet auf dich', ausgefuehrt: 'ausgeführt ✓', abgelehnt: 'abgelehnt', fehler: 'Fehler', abgelaufen: 'abgelaufen', laeuft: 'wird ausgeführt …'}[f.status] || f.status;
  return `<div class="karte frei"><div class="titel">Freigabe ${fid} <span class="mut">· ${esc(st)}</span></div><div class="md">${md(f.text || '')}</div>

// ── Vorlesen (Pi-Stimme des Bots) und Benachrichtigungen ──
const vorlesenAn = () => store.get('nb_vorlesen') === '1';
let vorleseNr = 0; let vorleseAudio = null;
function vorleserStopp() { vorleseNr++; if (vorleseAudio) { vorleseAudio.pause(); vorleseAudio = null; } }
function sprechtext(t) {
  let s = String(t).replace(/```[\s\S]*?```/g, ' Den Code findest du im Chat. ');
  const zeilen = []; let tab = false;
  for (const z of s.split('\n')) { if (z.trim().startsWith('|')) { if (!tab) zeilen.push('Die Tabelle steht im Chat.'); tab = true; continue; } tab = false; zeilen.push(z); }
  s = zeilen.join('\n').replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '$1').replace(/https?:\/\/\S+/g, 'Link im Chat').replace(/\bF-[0-9a-f]{6}\b/g, 'Freigabe')
    .replace(/^#{1,6}\s*/gm, '').replace(/^\s*[-*•]\s+/gm, '').replace(/[*_`>#]/g, '').replace(/\n{2,}/g, '\n').trim();
  if (s.length > 1400) s = s.slice(0, 1400).replace(/[^.]*$/, '') + ' Den Rest findest du im Chat.';
  return s;
}
async function vorlesen(text, stimme) {
  vorleserStopp(); const nr = vorleseNr;
  const saetze = sprechtext(text).split(/(?<=[.!?:;])\s+|\n+/).map((x) => x.trim()).filter(Boolean);
  const holen = (i) => fetch('/api/sprechen', {method: 'POST', headers: {'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json'},
    body: JSON.stringify({text: saetze[i], stimme: (stimme || '').startsWith('pi:') ? stimme : 'pi:thorsten-high'})}).then((r) => r.ok ? r.blob() : null).catch(() => null);
  let naechster = saetze.length ? holen(0) : null;
  for (let i = 0; i < saetze.length; i++) {
    const blob = await naechster; if (nr !== vorleseNr) return;
    naechster = i + 1 < saetze.length ? holen(i + 1) : null;
    if (!blob) continue;
    const url = URL.createObjectURL(blob); vorleseAudio = new Audio(url);
    await new Promise((ok) => { vorleseAudio.onended = ok; vorleseAudio.onerror = ok; vorleseAudio.play().catch(ok); });
    URL.revokeObjectURL(url); if (nr !== vorleseNr) return;
  }
}
function fertigMelden(sid) {
  const s = S.sessions.find((x) => x.id === sid); const b = bot(s?.bot);
  if (S.offen?.id === sid && vorlesenAn() && !document.hidden) {
    const m = [...S.offen.msgs].reverse().find((x) => x.role === 'bot' && x.text?.trim());
    if (m) vorlesen(m.text, b?.stimme);
  }
  if (store.get('nb_melden') === '1' && 'Notification' in window && Notification.permission === 'granted' && (document.hidden || S.offen?.id !== sid) && s && s.art !== 'intern') {
    const n = new Notification(`${b?.name || 'NookBot'}: ${s.titel || 'Antwort'}`, {body: (s.letzte || 'fertig').slice(0, 160), tag: sid, icon: 'icon.svg'});
    n.onclick = () => { window.focus(); S.ansicht = {art: 'chat', id: sid}; nav(); zeigen(); n.close(); };
  }
}

// ── Diktat: Aufnahme im Browser, Erkennung auf dem Pi (whisper.cpp) ──
async function diktieren(txt, groesse) {
  const k = $('#mic');
  if (S.aufnahme) { S.aufnahme.stop(); return; }
  if (!navigator.mediaDevices?.getUserMedia) return toast('Dieser Browser kann nicht aufnehmen (nur über https).');
  let strom;
  try { strom = await navigator.mediaDevices.getUserMedia({audio: true}); } catch (e) { return toast('Kein Mikrofon: ' + e.message); }
  const rec = new MediaRecorder(strom); const teile = [];
  rec.ondataavailable = (e) => e.data.size && teile.push(e.data);
  rec.onstop = async () => {
    strom.getTracks().forEach((t) => t.stop()); S.aufnahme = null; clearTimeout(S.aufT);
    k.classList.remove('an'); k.textContent = '…'; k.disabled = true;
    try {
      const blob = new Blob(teile, {type: rec.mimeType});
      const b64 = await new Promise((r) => { const f = new FileReader(); f.onload = () => r(String(f.result).split(',')[1]); f.readAsDataURL(blob); });
      const o = await api('POST', '/api/diktat', {b64});
      if (o.text) { txt.value = (txt.value.trim() ? txt.value.trimEnd() + ' ' : '') + o.text; groesse(); txt.dispatchEvent(new Event('input')); txt.focus(); }
      else toast('Nichts verstanden');
    } catch (e) { toast(e.message); }
    k.textContent = '🎙'; k.disabled = false;
  };
  rec.start(); S.aufnahme = rec; k.classList.add('an'); k.textContent = '■';
  S.aufT = setTimeout(() => rec.state === 'recording' && rec.stop(), 120000);
  toast('Sprich – nochmal tippen beendet');
}

        await api('POST', '/api/arbeit', {name: f.name, b64}); } catch (er) { toast(er.message); }
    }
    seiteArbeit();
  };
  $('#haupt').querySelectorAll('[data-ar-weg]').forEach((c) => c.onclick = async () => { if (!confirm(c.dataset.arWeg + ' löschen?')) return; await api('DELETE', '/api/arbeit/' + encodeURIComponent(c.dataset.arWeg)); seiteArbeit(); });
}

// ── Aktivität ──
const AKT_ART = {anruf: '📞', werkzeug: '🔧', frei: '⚙️', routine: '⏰', ausloeser: '⚡', freigabe: '✅', runde: '👥'};
async function seiteAktivitaet() {
  const f = S.aktFilter || (S.aktFilter = {tage: 1, bot: '', hintergrund: false});
  const o = await api('GET', `/api/aktivitaet?tage=${f.tage}&bot=${encodeURIComponent(f.bot)}${f.hintergrund ? '&hintergrund=1' : ''}`).catch(() => ({eintraege: []}));
  let tag = '';
  const zeilen = o.eintraege.map((e) => {
    const d = new Date(e.ts * 1000); const t = d.toLocaleDateString('de-DE', {weekday: 'long', day: '2-digit', month: '2-digit'});
    const kopfz = t !== tag ? `<h3 style="margin:14px 0 2px">${t}</h3>` : ''; tag = t;
    return kopfz + `<div class="akt ${e.ok ? '' : 'fehl'}"><span class="z">${d.toLocaleTimeString('de-DE', {hour: '2-digit', minute: '2-digit'})}</span>
      <span class="w">${AKT_ART[e.art] || '·'} <b>${esc(botName(e.bot))}</b> · ${esc(WERKZEUGE[e.was] || e.was)}${e.hintergrund ? ' <span class="mut">· im Hintergrund</span>' : ''}${e.ok ? '' : ' · fehlgeschlagen'}</span>
      ${e.detail ? `<span class="d">${esc(e.detail)}</span>` : ''}
      ${e.ref && (S.zurueck || {})[e.ref] === undefined ? `<span class="d"><button class="klein text" data-zurueck="${esc(e.ref)}">↩ Rückgängig</button></span>` : ''}</div>`;
  }).join('');
  $('#haupt').innerHTML = kopf('Aktivität', 'was die Bots getan haben') + `<div class="seite"><div class="bl"><div class="zeilen">
    <select id="fT" style="width:auto">${[[1, 'heute + gestern'], [7, '7 Tage'], [30, '30 Tage']].map(([v, n]) => `<option value="${v}" ${f.tage === v ? 'selected' : ''}>${n}</option>`).join('')}</select>
    <select id="fB" style="width:auto"><option value="">alle Bots</option>${S.bots.map((b) => `<option value="${b.id}" ${f.bot === b.id ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}</select>
    <label class="zeilen"><input type="checkbox" id="fH" ${f.hintergrund ? 'checked' : ''} style="width:auto"> nur im Hintergrund</label></div>
    ${zeilen || '<div class="box mut">Nichts in diesem Zeitraum.</div>'}</div></div>`;
  // Rückgängig: Termine/Entwürfe wieder löschen (Tabellen und Dokumente gehen nicht automatisch)
  const genommen = new Set(o.eintraege.filter((e) => e.was === 'Zurückgenommen').map((e) => (e.detail || '').split(' ')[0]));
  $('#haupt').querySelectorAll('[data-zurueck]').forEach((b) => {
    if (genommen.has(b.dataset.zurueck)) { b.replaceWith(document.createTextNode('↩ zurückgenommen')); return; }
    b.onclick = async () => {
      if (!confirm('Wirklich zurücknehmen? Termine werden ohne Absage gelöscht, Entwürfe gelöscht.')) return;
      try { await api('POST', `/api/freigaben/${b.dataset.zurueck}/rueckgaengig`); toast('Zurückgenommen'); seiteAktivitaet(); } catch (er) { toast(er.message); }
    };
  });
  $('#fT').onchange = (e) => { f.tage = +e.target.value; seiteAktivitaet(); };
  $('#fB').onchange = (e) => { f.bot = e.target.value; seiteAktivitaet(); };
  $('#fH').onchange = (e) => { f.hintergrund = e.target.checked; seiteAktivitaet(); };
}

// ── Erinnerungen ──
const ortszeit = (ms) => { const d = new Date(ms); const z = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`; };
const WDH = {'': 'einmalig', taeglich: 'täglich', werktags: 'werktags', woechentlich: 'wöchentlich', monatlich: 'monatlich'};
function seiteErinnerungen() {
  const l = [...(S.erinnerungen || [])].sort((a, b) => (a.erledigt - b.erledigt) || a.wann.localeCompare(b.wann));
  $('#haupt').innerHTML = kopf('Erinnerungen', 'Hinweise zur Uhrzeit aufs Handy', '<button class="pri klein" id="eNeu">+ Neu</button>') + `<div class="seite"><div class="bl">${l.map((e) => `<div class="eintrag" style="cursor:default">
    <div class="t"><div class="n" style="${e.erledigt ? 'text-decoration:line-through;color:var(--mut)' : ''}">${esc(e.text)}</div><div class="s">${esc(e.wann.replace('T', ' '))} · ${WDH[e.wiederholung] || ''} · ${esc(botName(e.bot))}</div></div>
    <button class="klein text" data-e-edit="${e.id}">✎</button><button class="klein text" data-e-weg="${e.id}">✕</button></div>`).join('') || '<div class="box mut">Keine Erinnerungen. Oder per Chat: „erinnere mich morgen um 8 an …“</div>'}</div></div>`;
  const speichern = async (neu) => { try { await api('PUT', '/api/erinnerungen', {erinnerungen: neu}); await laden(); seiteErinnerungen(); } catch (e) { toast(e.message); } };
  const dialog = (e) => {
    const d = $('#dlg');
    d.innerHTML = `<h3 style="margin-top:0">${e ? 'Erinnerung ändern' : 'Neue Erinnerung'}</h3>${feld('Woran?', `<input id="eT" value="${esc(e?.text || '')}">`)}
      <div class="reihe">${feld('Wann', `<input type="datetime-local" id="eW" value="${esc(e?.wann || ortszeit(Date.now() + 36e5))}">`)}
      ${feld('Wiederholung', `<select id="eR">${Object.entries(WDH).map(([k, v]) => `<option value="${k}" ${(e?.wiederholung || '') === k ? 'selected' : ''}>${v}</option>`).join('')}</select>`)}</div>
      <div class="zeilen"><button class="pri" id="eOk">Speichern</button><button onclick="this.closest('dialog').close()">Abbrechen</button></div>`;
    $('#eOk').onclick = () => { const n = {...(e || {}), text: $('#eT').value.trim(), wann: $('#eW').value, wiederholung: $('#eR').value, erledigt: false};
      if (!n.text || !n.wann) return toast('Text und Zeit nötig'); d.close(); speichern(e ? S.erinnerungen.map((x) => x.id === e.id ? n : x) : [...S.erinnerungen, n]); };
    d.showModal();
  };
  $('#eNeu').onclick = () => dialog(null);
  $('#haupt').querySelectorAll('[data-e-edit]').forEach((c) => c.onclick = () => dialog(S.erinnerungen.find((x) => x.id === c.dataset.eEdit)));
  $('#haupt').querySelectorAll('[data-e-weg]').forEach((c) => c.onclick = () => { if (confirm('Erinnerung löschen?')) speichern(S.erinnerungen.filter((x) => x.id !== c.dataset.eWeg)); });
}

// ── Wissen ──
async function seiteWissen() {
  $('#haupt').innerHTML = kopf('Wissen', 'Dateien, die die Bots lesen') + '<div class="seite"><div class="bl" id="wL"><div class="box mut">lädt …</div></div></div>';
  const o = await api('GET', '/api/wissen').catch((e) => { toast(e.message); return {global: [], bots: {}}; });
  const box = (scope, titel, l) => `<div class="box"><h3>${esc(titel)}</h3>${l.map((w) => `<div class="teil"><span style="flex:1">📄 ${esc(w.name)}</span><span class="mut">${Math.ceil(w.groesse / 1000)} KB</span>
    <button class="klein text" data-w-zeigen="${esc(scope)}|${esc(w.name)}">ansehen</button><button class="klein text" data-w-weg="${esc(scope)}|${esc(w.name)}">✕</button></div>`).join('') || '<p class="mut">Keine Dateien.</p>'}
    <div class="zeilen" style="margin-top:8px"><input type="file" multiple data-w-hoch="${esc(scope)}" style="width:auto"></div></div>`;
  $('#wL').innerHTML = `<p class="mut">Text, PDF, Word, Excel, PowerPoint, OpenDocument, HTML … – der Pi wandelt alles in Text um. Oder Dateien auf eine Box ziehen.</p>`
    + box('global', 'Für alle Bots', o.global || []) + S.bots.map((b) => box(b.id, b.name, o.bots?.[b.id] || [])).join('');
  $('#wL').querySelectorAll('[data-w-hoch]').forEach((i) => {
    i.onchange = async (e) => { for (const f of e.target.files) await wissenHoch(i.dataset.wHoch, f); await laden(); seiteWissen(); };
    const b = i.closest('.box');
    b.addEventListener('dragover', (e) => { e.preventDefault(); b.classList.add('ziehen'); });
    b.addEventListener('dragleave', () => b.classList.remove('ziehen'));
    b.addEventListener('drop', async (e) => { e.preventDefault(); b.classList.remove('ziehen'); for (const f of e.dataTransfer.files) await wissenHoch(i.dataset.wHoch, f); await laden(); seiteWissen(); });
  });
}

// ── Datenbanken (Abfragen-Bibliothek) ──
async function seiteDatenbanken() {
  $('#haupt').innerHTML = kopf('Datenbanken', 'Beschreibung, Schema-Notizen, feste Abfragen', '<button class="pri klein" id="dbSpeichern">Speichern</button>') + '<div class="seite"><div class="bl" id="dbL"><div class="box mut">lädt …</div></div></div>';

    $('#dbL').innerHTML = `<p class="mut">Bots mit Datenbank-Zugriff bekommen das als Skill: feste Abfragen, die sie anpassen dürfen – gerechnet wird per SQL.</p>` + dbs.map((d, i) => `<div class="box">
      <div class="reihe">${feld('Titel', `<input data-db="${i}|titel" value="${esc(d.titel || '')}">`)}${feld('Name in home-mcp', `<input data-db="${i}|name" value="${esc(d.name || '')}">`)}</div>
      ${feld('Beschreibung', `<textarea rows="2" data-db="${i}|beschreibung">${esc(d.beschreibung || '')}</textarea>`)}

      <div class="zeilen"><button class="klein" data-db-schema="${esc(d.name || '')}">Schema ansehen</button><button class="klein text" data-db-weg="${i}">Datenbank entfernen</button></div>
      <h3 style="margin-top:14px">Abfragen</h3>${(d.abfragen || []).map((q, j) => `<div style="border-top:1px solid var(--line);padding-top:8px;margin-top:8px">
        <div class="reihe">${feld('Name', `<input data-q="${i}|${j}|name" value="${esc(q.name || '')}">`)}${feld('Parameter (name=standard, …)', `<input data-q="${i}|${j}|parameter" value="${esc((q.parameter || []).map((p) => p.name + (p.standard ? '=' + p.standard : '')).join(', '))}">`)}</div>
        ${feld('Zweck', `<input data-q="${i}|${j}|zweck" value="${esc(q.zweck || '')}">`)}
        ${feld('SQL', `<textarea rows="6" data-q="${i}|${j}|sql" style="font-family:ui-monospace,Menlo,monospace;font-size:13px">${esc(q.sql || '')}</textarea>`)}
        <button class="klein text" data-q-weg="${i}|${j}">Abfrage entfernen</button></div>`).join('')}
      <button class="klein" data-q-neu="${i}" style="margin-top:8px">+ Abfrage</button></div>`).join('') + '<button class="klein" id="dbNeu">+ Datenbank</button>';
    S.bearbeitet = true;
    $('#dbL').querySelectorAll('[data-db]').forEach((x) => x.oninput = () => { const [i, k] = x.dataset.db.split('|'); dbs[i][k] = x.value; });
    $('#dbL').querySelectorAll('[data-q]').forEach((x) => x.oninput = () => { const [i, j, k] = x.dataset.q.split('|'); const q = dbs[i].abfragen[j];
      q[k] = k === 'parameter' ? x.value.split(',').map((p) => p.trim()).filter(Boolean).map((p) => ({name: p.split('=')[0].trim().replace(/^:/, ''), standard: (p.split('=')[1] || '').trim()})) : x.value; });
    $('#dbL').querySelectorAll('[data-q-neu]').forEach((x) => x.onclick = () => { (dbs[x.dataset.qNeu].abfragen ||= []).push({name: '', zweck: '', sql: '', parameter: []}); zeichnen(); });
    $('#dbL').querySelectorAll('[data-q-weg]').forEach((x) => x.onclick = () => { const [i, j] = x.dataset.qWeg.split('|'); dbs[i].abfragen.splice(j, 1); zeichnen(); });
    $('#dbL').querySelectorAll('[data-db-weg]').forEach((x) => x.onclick = () => { if (confirm('Datenbank aus der Bibliothek entfernen?')) { dbs.splice(x.dataset.dbWeg, 1); zeichnen(); } });
    $('#dbL').querySelectorAll('[data-db-schema]').forEach((x) => x.onclick = async () => {

    const vSetzen = async () => { try { await api('PUT', '/api/vorschlaege', {aktiv: $('#vAktiv').checked, zeit: $('#vZeit').value}); toast('Gespeichert'); } catch (e) { toast(e.message); } };
    $('#vAktiv').onchange = vSetzen; $('#vZeit').onchange = vSetzen;
    $('#vJetzt').onclick = async () => { try { await api('POST', '/api/vorschlaege/durchsicht'); toast('Durchsicht läuft – Vorschläge erscheinen im Chat des Kapitäns'); } catch (e) { toast(e.message); } };
  }
  $('#eVorlesen').onchange = (e) => store.set('nb_vorlesen', e.target.checked ? '1' : null);
  $('#eMelden').onchange = async (e) => {
    if (e.target.checked && 'Notification' in window && Notification.permission !== 'granted') {
      const p = await Notification.requestPermission(); if (p !== 'granted') { e.target.checked = false; return toast('Der Browser erlaubt keine Benachrichtigungen'); }
    }
    store.set('nb_melden', e.target.checked ? '1' : null);
  };
}

// ── Start ──
async function start() {
  if (!TOKEN) { $('#login').hidden = false; return; }
  try { await laden(); } catch (e) { $('#login').hidden = false; $('#loginFehler').textContent = e.message; return; }
  $('#login').hidden = true; $('#app').hidden = false;
  const letzte = store.get('nb_ansicht');
  S.ansicht = {art: 'chat', id: S.sessions.some((x) => x.id === letzte) || S.bots.some((b) => b.sitzung === letzte) ? letzte : S.bots[0]?.sitzung};
  nav(); zeigen(); ereignisse(); statusLaden(); setInterval(statusLaden, 300000);
  setInterval(() => { if (S.webFreigaben && Object.values(S.freigaben).some((f) => f && (f.status === 'offen' || f.status === 'laeuft'))) freigabenLaden(); }, 20000);
}
$('#loginForm').addEventListener('submit', (e) => { e.preventDefault(); TOKEN = $('#tok').value.trim(); store.set('nb_token', TOKEN); $('#loginFehler').textContent = ''; start(); });
start();
</script>
</body>
